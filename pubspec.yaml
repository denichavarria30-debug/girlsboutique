name: girls_boutique_app
description: "Aplicación móvil para punto de venta, inventario, apartados y catálogo público de Girls Boutique."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase Core & Backend
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4

  # Manejo de Estado (MVVM)
  provider: ^6.1.2

  # Utilidades & Enlaces externos (WhatsApp, Google Maps)
  url_launcher: ^6.3.1
  intl: ^0.20.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/