name: Publicar Girls Boutique

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      # Configurar Java necesario para compilar Android/APK
      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependencias
        run: flutter pub get

      - name: Construir aplicación web
        run: flutter build web --release --base-href "/girlsboutique/"

      - name: Preparar publicación web
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Construir APK
        run: flutter build apk --release

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar aplicación
        id: deployment
        uses: actions/deploy-pages@v4
